name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # 22, not 20: package.json declares `engines: >=22.0.0`, and this was
          # the last leg still on 20. It is not a hypothetical mismatch -- the
          # token build on wave2/tokens calls fs.globSync, added in Node 22, and
          # this job is the only one that failed on it ("SyntaxError: The
          # requested module 'fs' does not provide an export named 'globSync'",
          # Node.js v20.20.2) while CI passed on 22 and 24.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:tokens
      - run: npx ng build docs --base-href=/onyx-ng/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
