name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, not 20: package.json declares `engines: >=22.0.0`, and this was
          # the last leg still on 20. It is not a hypothetical mismatch -- the
          # token build on wave2/tokens calls fs.globSync, added in Node 22, and
          # this job is the only one that failed on it ("SyntaxError: The
          # requested module 'fs' does not provide an export named 'globSync'",
          # Node.js v20.20.2) while CI passed on 22 and 24.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:tokens
      - run: npx ng build docs --base-href=/onyx-ng/
      # GitHub Pages has no SPA fallback: it serves 404.html for any path it
      # cannot find on disk, so a refresh or a direct link to a client-side
      # route like /onyx-ng/components/dialog returns GitHub's generic 404 and
      # the app never boots. Shipping the built index.html as 404.html hands
      # those paths back to the Angular router. The 404 STATUS remains -- Pages
      # always returns it for the fallback -- but the page is fully functional.
      - run: cp dist/docs/index.html dist/docs/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
