name: PUB-1 proof (temporary)
# Temporary, removed before the PR is final. Runs on a push to the PUB-1 branch
# so that the `release` job's gate expression from publish.yml can be observed
# on GitHub's own evaluator: with no successful `workflow_run` context behind
# the event, the job must be SKIPPED.
on:
  push:
    branches: [pub-1/gate-publish]

permissions:
  contents: read

jobs:
  release-gate-copied-from-publish-yml:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - run: echo "this step would have published"
  context-seen-by-the-gate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_run.conclusion='${{ github.event.workflow_run.conclusion }}'"
          echo "workflow_run.event='${{ github.event.workflow_run.event }}'"
          echo "workflow_run.head_branch='${{ github.event.workflow_run.head_branch }}'"
          echo "gate=${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}"
